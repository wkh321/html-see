<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ 邮箱发送演示</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; margin: 0; padding: 24px; color: #333; }
  .wrap { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #999; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  textarea { min-height: 90px; resize: vertical; }
  button { margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #07c160; color: #fff; font-size: 15px; cursor: pointer; }
  button:hover { opacity: .9; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .res { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 13px; background: #f7f7f7; white-space: pre-wrap; word-break: break-all; display: none; }
  .res.ok { background: #e8f9ee; color: #0a6b2d; }
  .res.err { background: #fdecec; color: #a22; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QQ 邮箱发送演示</h1>
  <div class="sub">发送方为 Vercel 环境变量中配置的 QQ 邮箱</div>

  <div class="row">
    <div><label>收件邮箱</label><input id="to" placeholder="收件人@qq.com"></div>
    <div><label>标题</label><input id="title" placeholder="邮件标题"></div>
  </div>
  <label>正文（支持 HTML）</label>
  <textarea id="content" placeholder="邮件内容"></textarea>
  <button onclick="sendMail()">发送邮件</button>

  <hr style="margin:22px 0;border:none;border-top:1px solid #eee">

  <div class="row">
    <div><label>验证码位数</label><input id="digits" type="number" value="6"></div>
    <div><label>有效期(分钟)</label><input id="expire" type="number" value="5"></div>
  </div>
  <button onclick="sendCode()" style="background:#1989fa">发送验证码</button>
  <div class="row">
    <div><label>输入验证码</label><input id="code"></div>
  </div>
  <button onclick="verify()" style="background:#ff9d00">校验验证码</button>

  <div class="res" id="res"></div>
</div>

<script src="qqmail-client.js"></script>
<script>
  // 改成你自己的 Vercel 域名；若演示页与函数同域部署可留空
  MailClient.base = '';

  const res = document.getElementById('res');
  function show(r, isBool) {
    res.style.display = 'block';
    res.className = 'res ' + ((isBool === undefined ? r.ok : r) ? 'ok' : 'err');
    res.textContent = typeof r === 'string' ? r : JSON.stringify(r, null, 2);
  }
  async function sendMail() {
    show(await MailClient.send({ to: to.value, title: title.value, content: content.value }));
  }
  async function sendCode() {
    const r = await MailClient.sendCode({
      to: to.value, title: title.value || '你的验证码',
      digits: +digits.value, expire: +expire.value
    });
    show(r);
    if (r.ok) alert('验证码已发送，请查收邮箱。本次验证码：' + r.code);
  }
  function verify() {
    show(MailClient.verifyCode(code.value) ? '验证码正确 ✓' : '验证码错误 ✗', true);
  }
</script>
</body>
</html>
